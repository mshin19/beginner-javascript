<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Promises</title>
  <link rel="stylesheet" href="../base.css">
</head>

<body>
  <script>
    function makePizza(toppings) {
      const pizzaPromise = new Promise(function(resolve, reject) {
        //reject if people try with pineapple
        if(toppings.includes('pineapple')) {
          reject('Seriously? Get out!');
        }
        //wait 1 second for pizza to cook
        setTimeout(function() {
          resolve(`Here is your pizza with ${toppings.join(' ')}`);
        }, 1000);
        //when you are ready, you can resolve this promise
        //if something went wron, we can reject this promise
      });
      return pizzaPromise;
    }

    // const pepperoniPromise = makePizza(['pepperoni']);
    // const mexicanPromise = makePizza(['jalapenos', 'tocino']);
    
    // console.log(pepperoniPromise, mexicanPromise);

    // pepperoniPromise.then(function(pizza) {
    //   console.log('got it');
    //   console.log(pizza);
    // });

    makePizza(['ham', 'pineapple'])
    .then(pizza => {
      console.log(pizza);
    }).catch(err => {
      console.log(err);
    })
  </script>
</body>

</html>
